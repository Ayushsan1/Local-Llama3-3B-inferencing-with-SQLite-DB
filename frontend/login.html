<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Local AI Inference System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="auth-wrapper">
    <div id="toast" class="toast"></div>

    <div class="auth-container">
      <div class="auth-header">
        <h1> Local-Inference</h1>
        <p>Log in to access your local AI workspace</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required minlength="3"
            maxlength="50" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required minlength="8"
            maxlength="100" autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Sign up here</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
