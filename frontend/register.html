<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Local AI Inference System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="auth-wrapper">
    <div id="toast" class="toast"></div>

    <div class="auth-container">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Register a local profile to save chat logs</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            class="form-control" 
            placeholder="Choose username" 
            required 
            minlength="3" 
            maxlength="50"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Choose password (min 8 characters)" 
            required 
            minlength="8" 
            maxlength="100"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span id="btn-text">Sign Up</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already registered? <a href="login.html">Sign in here</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
